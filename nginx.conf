server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single Page App: every route falls back to index.html (Expo Router handles it)
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
