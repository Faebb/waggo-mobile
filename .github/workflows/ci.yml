name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Tests + coverage
        run: npm run test:coverage -- --ci

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -t waggo-web:${{ github.sha }} .
